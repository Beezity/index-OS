<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer><family>Perfect DOS VGA 437 Universal</family></prefer>
  </alias>

  <!-- The Index UI uses a bitmap-derived DOS face. Keep it crisp instead of
       letting different GTK/Qt applications choose different hinting modes. -->
  <match target="font">
    <test name="family" compare="eq">
      <string>Perfect DOS VGA 437 Universal</string>
    </test>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
