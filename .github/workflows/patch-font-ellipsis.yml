name: Patch bundled ellipsis glyph

on:
  push:
    branches:
      - fix/font-ellipsis-glyph

permissions:
  contents: write

jobs:
  patch-font:
    if: ${{ !contains(github.event.head_commit.message, '[font-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/font-ellipsis-glyph
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fontTools
        run: python -m pip install --disable-pip-version-check fonttools

      - name: Patch U+2026
        run: |
          python tools/patch-font-ellipsis.py assets/PerfectDOSVGA437-Universal.ttf | tee /tmp/font-patch-report.txt
          grep -q '^changed=True$' /tmp/font-patch-report.txt

      - name: Verify mapping and glyph
        run: |
          python - <<'PY'
          from fontTools.ttLib import TTFont
          f = TTFont('assets/PerfectDOSVGA437-Universal.ttf')
          name = f.getBestCmap().get(0x2026)
          assert name, 'U+2026 missing after patch'
          g = f['glyf'][name]
          g.recalcBounds(f['glyf'])
          assert g.numberOfContours > 0, 'ellipsis glyph has no contours'
          print('U+2026 ->', name)
          print('bounds:', g.xMin, g.yMin, g.xMax, g.yMax)
          print('advance:', f['hmtx'].metrics[name][0])
          PY

      - name: Commit patched font
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/PerfectDOSVGA437-Universal.ttf
          git diff --cached --quiet && { echo 'font was unchanged'; exit 1; }
          git commit -m 'Patch U+2026 ellipsis glyph [font-patched]'
          git push origin HEAD:fix/font-ellipsis-glyph
