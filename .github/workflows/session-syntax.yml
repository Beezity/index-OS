name: Session installer syntax

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'install-fedora.sh'
      - 'install-fish.sh'
      - 'scripts/**'
      - 'fish/**'
      - 'labwc/session/**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer shell syntax
        run: bash -n install.sh install-fedora.sh install-fish.sh scripts/common.sh scripts/install-common.sh scripts/validate.sh scripts/distro/arch.sh scripts/distro/fedora.sh
      - name: Check Fish syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y fish
          fish -n fish/config.fish
      - name: Check session entry
        run: grep -q '^Exec=/usr/bin/labwc$' labwc/session/the-index.desktop
