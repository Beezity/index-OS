name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck libxml2-utils

      - name: Check installer syntax
        run: |
          bash -n install.sh
          bash -n greeter/install.sh
          sh -n greeter/index-session
          sh -n greeter/labwc/autostart

      - name: Shellcheck scripts
        run: |
          shellcheck --severity=error install.sh greeter/install.sh greeter/index-session greeter/labwc/autostart \
            labwc/config/autostart labwc/config/index-lock labwc/config/index-idle \
            labwc/config/index-input labwc/config/index-clip \
            labwc/config/index-display-save labwc/config/index-display-restore \
            labwc/config/index-logout labwc/app-fixes/index-snip \
            labwc/app-fixes/index-default-apps labwc/app-fixes/apply-browser-fixes.sh

      - name: Validate XML
        run: |
          xmllint --noout labwc/config/rc.xml
          xmllint --noout labwc/config/menu.xml
          xmllint --noout labwc/config/fontconfig/fonts.conf
          xmllint --noout greeter/labwc/rc.xml

      - name: Check required repository assets
        run: |
          files=(
            wallpaper/the-index.png
            quickshell/shell.qml quickshell/Bar.qml quickshell/Atmosphere.qml quickshell/lock/lock.qml quickshell/prescript.json
            labwc/config/rc.xml labwc/config/menu.xml labwc/config/autostart labwc/config/environment
            labwc/config/index-lock labwc/config/index-idle labwc/config/index-input labwc/config/fontconfig/fonts.conf
            labwc/theme/the-index/labwc/themerc labwc/theme/the-index/labwc/close.xbm
            labwc/theme/the-index/labwc/iconify.xbm labwc/theme/the-index/labwc/max.xbm
            labwc/theme/the-index-gtk/gtk-3.0/gtk.css labwc/theme/the-index-gtk/gtk-4.0/gtk.css
            labwc/config/portal/labwc-portals.conf labwc/config/portal/wlr.conf
            labwc/app-fixes/index-snip labwc/app-fixes/index-default-apps
            assets/PerfectDOSVGA437-Universal.ttf
            greeter/config.toml greeter/regreet.toml greeter/gtk.css
            greeter/index-session greeter/index.desktop greeter/install.sh
            greeter/labwc/rc.xml greeter/labwc/autostart
          )
          for f in "${files[@]}"; do test -s "$f" || { echo "missing: $f"; exit 1; }; done

      - name: Check greeter safety and session wiring
        run: |
          grep -q 'user = "greeter"' greeter/config.toml
          grep -q 'XDG_CONFIG_HOME=/etc/index-greeter dbus-run-session labwc' greeter/config.toml
          grep -q 'exec regreet --config /etc/greetd/regreet.toml' greeter/labwc/autostart
          grep -q '^Exec=/usr/local/bin/index-session$' greeter/index.desktop
          grep -q 'exec dbus-run-session labwc' greeter/index-session
          if grep -q 'cage' greeter/config.toml greeter/install.sh; then
            echo 'Cage must not host ReGreet; VMware DRM output creation is unreliable'
            exit 1
          fi
          if grep -q '^\[initial_session\]' greeter/config.toml; then
            echo 'greetd autologin/initial_session must remain disabled'
            exit 1
          fi

      - name: Check Quickshell component registry
        run: |
          while read -r first second third fourth; do
            [ -n "$first" ] || continue
            case "$first" in \#*) continue ;; esac
            if [ "$first" = "singleton" ]; then file="$fourth"; else file="$third"; fi
            [ -n "$file" ] || { echo "invalid qmldir entry: $first $second $third $fourth"; exit 1; }
            test -s "quickshell/$file" || { echo "qmldir references missing file: $file"; exit 1; }
          done < quickshell/qmldir

      - name: Check Index font naming consistency
        run: grep -RIn --include='*.qml' --include='*.ini' --include='*.xml' 'Perfect DOS VGA 437 Universal' quickshell labwc >/dev/null

      - name: Reject removed boot behavior in installer
        run: |
          if grep -niE 'autologin\.conf|GRUB_CMDLINE|/etc/kernel/cmdline|/boot/loader/entries|/boot/limine|mkinitcpio|/etc/issue' install.sh greeter/install.sh; then
            echo 'removed boot/autologin behavior was reintroduced'
            exit 1
          fi
