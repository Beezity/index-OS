name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck libxml2-utils fish

      - name: Check installer syntax
        run: |
          bash -n install.sh install-fedora.sh install-debian.sh install-fish.sh setup.sh remove-display-manager.sh
          bash -n scripts/common.sh scripts/install-common.sh scripts/validate.sh scripts/index-doctor scripts/index-backup scripts/index-restore scripts/index-uninstall scripts/index-update scripts/index-appearance scripts/index-audio scripts/index-network scripts/index-bluetooth scripts/index-power scripts/index-input
          bash -n scripts/distro/arch.sh scripts/distro/fedora.sh scripts/distro/debian.sh
          fish -n fish/config.fish

      - name: Shellcheck scripts
        run: |
          shellcheck --severity=error install.sh install-fedora.sh install-debian.sh install-fish.sh setup.sh remove-display-manager.sh \
            scripts/common.sh scripts/install-common.sh scripts/validate.sh scripts/index-doctor scripts/index-backup scripts/index-restore scripts/index-uninstall scripts/index-update scripts/index-appearance scripts/index-audio scripts/index-network scripts/index-bluetooth scripts/index-power scripts/index-input \
            scripts/distro/arch.sh scripts/distro/fedora.sh scripts/distro/debian.sh \
            labwc/config/autostart labwc/config/index-lock labwc/config/index-idle \
            labwc/config/index-clip \
            labwc/config/index-display-save labwc/config/index-display-restore \
            labwc/config/index-logout labwc/app-fixes/index-snip \
            labwc/app-fixes/index-default-apps labwc/app-fixes/apply-browser-fixes.sh

      - name: Validate XML
        run: |
          xmllint --noout labwc/config/rc.xml
          xmllint --noout labwc/config/menu.xml
          xmllint --noout labwc/config/fontconfig/fonts.conf

      - name: Exercise input helper
        run: |
          tmp="$(mktemp)"
          bad="$(mktemp)"
          cp labwc/config/rc.xml "$tmp"
          sed -i '/<\/libinput>/i\    <device name="CI Special Mouse">\n      <pointerSpeed>0.77</pointerSpeed>\n      <naturalScroll>no</naturalScroll>\n    </device>' "$tmp"

          state="$(INDEX_INPUT_RC="$tmp" INDEX_INPUT_NO_RELOAD=1 sh scripts/index-input state)"
          test "$(printf '%s' "$state" | cut -f1)" = 1
          INDEX_INPUT_RC="$tmp" INDEX_INPUT_NO_RELOAD=1 sh scripts/index-input set-speed 0.25
          INDEX_INPUT_RC="$tmp" INDEX_INPUT_NO_RELOAD=1 sh scripts/index-input set-natural-scroll yes
          INDEX_INPUT_RC="$tmp" INDEX_INPUT_NO_RELOAD=1 sh scripts/index-input set-tap no
          state="$(INDEX_INPUT_RC="$tmp" INDEX_INPUT_NO_RELOAD=1 sh scripts/index-input state)"
          test "$(printf '%s' "$state" | cut -f2)" = 0.25
          test "$(printf '%s' "$state" | cut -f3)" = yes
          test "$(printf '%s' "$state" | cut -f5)" = no
          grep -q '<pointerSpeed>0.77</pointerSpeed>' "$tmp"
          grep -q '<naturalScroll>no</naturalScroll>' "$tmp"
          xmllint --noout "$tmp"

          printf '<labwc_config><libinput/></labwc_config>\n' > "$bad"
          test "$(INDEX_INPUT_RC="$bad" INDEX_INPUT_NO_RELOAD=1 sh scripts/index-input state | cut -f1)" = 0
          if INDEX_INPUT_RC="$bad" INDEX_INPUT_NO_RELOAD=1 sh scripts/index-input set-speed 0.50; then
            echo 'malformed input backend unexpectedly accepted a write'
            exit 1
          fi
          if INDEX_INPUT_RC="$tmp" INDEX_INPUT_NO_RELOAD=1 sh scripts/index-input set-speed '0.5;echo bad'; then
            echo 'unsafe pointer speed unexpectedly accepted'
            exit 1
          fi
          rm -f "$tmp" "$bad"

      - name: Check required repository assets
        run: |
          files=(
            wallpaper/the-index.png
            quickshell/shell.qml quickshell/Bar.qml quickshell/SettingsPanel.qml quickshell/BluetoothMenu.qml quickshell/AppearancePanel.qml quickshell/AudioPanel.qml quickshell/NetworkPanel.qml quickshell/PowerPanel.qml quickshell/InputPanel.qml quickshell/Atmosphere.qml quickshell/lock/lock.qml quickshell/prescript.json
            labwc/config/rc.xml labwc/config/menu.xml labwc/config/autostart labwc/config/environment
            labwc/config/index-lock labwc/config/index-idle labwc/config/index-clip labwc/config/fontconfig/fonts.conf
            labwc/theme/the-index/labwc/themerc labwc/theme/the-index/labwc/close.xbm
            labwc/theme/the-index/labwc/iconify.xbm labwc/theme/the-index/labwc/max.xbm
            labwc/theme/the-index-gtk/gtk-3.0/gtk.css labwc/theme/the-index-gtk/gtk-4.0/gtk.css
            labwc/config/portal/labwc-portals.conf labwc/config/portal/wlr.conf
            labwc/app-fixes/index-snip labwc/app-fixes/index-default-apps
            assets/PerfectDOSVGA437-Universal.ttf install.sh install-fedora.sh install-debian.sh install-fish.sh setup.sh remove-display-manager.sh
            scripts/common.sh scripts/install-common.sh scripts/validate.sh scripts/index-doctor scripts/index-backup scripts/index-restore scripts/index-uninstall scripts/index-update scripts/index-appearance scripts/index-audio scripts/index-network scripts/index-bluetooth scripts/index-power scripts/index-input scripts/distro/arch.sh scripts/distro/fedora.sh scripts/distro/debian.sh
          )
          for f in "${files[@]}"; do test -s "$f" || { echo "missing: $f"; exit 1; }; done

      - name: Reject legacy display manager installation
        run: |
          if grep -nEi 'greetd|regreet|greeter/install\.sh' setup.sh install.sh install-fedora.sh install-debian.sh scripts/*.sh scripts/distro/*.sh; then
            echo 'legacy display-manager installation was reintroduced into the default setup'
            exit 1
          fi

      - name: Check Quickshell component registry
        run: |
          while read -r first second third fourth; do
            [ -n "$first" ] || continue
            case "$first" in \#*) continue ;; esac
            if [ "$first" = "singleton" ]; then file="$fourth"; else file="$third"; fi
            [ -n "$file" ] || { echo "invalid qmldir entry: $first $second $third $fourth"; exit 1; }
            test -s "quickshell/$file" || { echo "qmldir references missing file: $file"; exit 1; }
          done < quickshell/qmldir
          grep -q '^SettingsPanel 1\.0 SettingsPanel\.qml$' quickshell/qmldir || {
            echo 'Bar requires SettingsPanel but it is not registered in qmldir'
            exit 1
          }
          grep -q '^BluetoothMenu 1\.0 BluetoothMenu\.qml$' quickshell/qmldir || {
            echo 'Bar and SettingsPanel require BluetoothMenu but it is not registered in qmldir'
            exit 1
          }
          grep -q '^AppearancePanel 1\.0 AppearancePanel\.qml$' quickshell/qmldir || {
            echo 'SettingsPanel requires AppearancePanel but it is not registered in qmldir'
            exit 1
          }
          grep -q '^AudioPanel 1\.0 AudioPanel\.qml$' quickshell/qmldir || {
            echo 'SettingsPanel requires AudioPanel but it is not registered in qmldir'
            exit 1
          }
          grep -q '^NetworkPanel 1\.0 NetworkPanel\.qml$' quickshell/qmldir || {
            echo 'SettingsPanel requires NetworkPanel but it is not registered in qmldir'
            exit 1
          }
          grep -q '^PowerPanel 1\.0 PowerPanel\.qml$' quickshell/qmldir || {
            echo 'SettingsPanel requires PowerPanel but it is not registered in qmldir'
            exit 1
          }
          grep -q '^InputPanel 1\.0 InputPanel\.qml$' quickshell/qmldir || {
            echo 'SettingsPanel requires InputPanel but it is not registered in qmldir'
            exit 1
          }

      - name: Check Index font naming consistency
        run: grep -RIn --include='*.qml' --include='*.ini' --include='*.xml' 'Perfect DOS VGA 437 Universal' quickshell labwc >/dev/null

      - name: Reject removed boot behavior in installers
        run: |
          if grep -niE 'autologin\.conf|GRUB_CMDLINE|/etc/kernel/cmdline|/boot/loader/entries|/boot/limine|mkinitcpio|/etc/issue' install.sh install-fedora.sh install-debian.sh setup.sh scripts/*.sh scripts/distro/*.sh; then
            echo 'removed boot/autologin behavior was reintroduced'
            exit 1
          fi
